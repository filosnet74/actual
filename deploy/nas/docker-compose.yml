# Actual Budget (personalised build) for a home NAS.
#
# Image: built from this repository with ./build-image.sh, then imported on
# the NAS (see README.md). Budgets, settings and users are stored in
# ./actual-data next to this file, so they survive image updates.

services:
  actual:
    image: actual-custom:latest
    container_name: actual
    restart: unless-stopped
    ports:
      # http://<NAS-IP>:5006
      - '5006:5006'
    volumes:
      - ./actual-data:/data
    environment:
      - TZ=Europe/Rome
      # Optional: serve HTTPS directly from the container. Put key.pem and
      # cert.pem in ./actual-data and uncomment the next two lines.
      # - ACTUAL_HTTPS_KEY=/data/key.pem
      # - ACTUAL_HTTPS_CERT=/data/cert.pem
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:5006/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
